<header class="app-header">
    <div class="content-container header-content">
        <a class="brand" routerLink="/dashboard" aria-label="Coiny dashboard">
            <img src="/assets/icons/favicon.svg" alt="Coiny Logo" class="brand-logo">
            <span class="brand-name">COINY</span>
        </a>
        <nav class="navigation">
            <a
                class="navigation-link"
                routerLink="/accounts"
                routerLinkActive="active"
                aria-label="Accounts">

                <app-icon
                    class="navigation-icon"
                    name="accounts">
                </app-icon>
            </a>
            <a 
                class="navigation-link"
                routerLink="/budget"
                aria-label="Budget">

                <app-icon
                    class="navigation-icon"
                    name="budget">
                </app-icon>
            </a>
            <div class="user" #profileRoot (focusout)="onFocusOut($event)">
                <button #avatarButton class="avatar-button" type="button" aria-label="Profile menu"
                    aria-haspopup="menu" [attr.aria-expanded]="menuOpen()" aria-controls="profile-menu"
                    (click)="toggleMenu()" (keydown)="onAvatarKeydown($event)">
                    {{ initial() }}
                </button>
                @if (menuOpen()) {
                    <div id="profile-menu" class="profile-menu" role="menu" aria-label="Your account" (keydown)="onMenuKeydown($event)">
                        <div class="profile-details" role="none">
                            @if (auth.currentUser(); as user) {
                                <strong>{{ user.firstName?.trim() || 'Your account' }}</strong>
                                <span>{{ user.email }}</span>
                            } @else {
                                <strong>Your account</strong>
                                <span role="status">{{ auth.profileLoading() ? 'Loading profile…' : 'Profile unavailable' }}</span>
                            }
                        </div>
                        <button #logoutButton type="button" role="menuitem" class="logout-button" (click)="logout()">Log out</button>
                    </div>
                }
            </div>
        </nav>
    </div>
    <div class="content-container">
        <div class="header-divider"></div>
    </div>
</header>
