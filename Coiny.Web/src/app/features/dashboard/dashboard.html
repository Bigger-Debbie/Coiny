<div class="dashboard-layout">
  <section class="net-worth-section">
    
    <div class="net-worth-main">
      <div class="net-worth-summary">
        
        <div class="net-worth-primary">
          <h1 class="net-worth-value">
            {{ dashboard?.netWorth | currency }}
          </h1>
          <span class="net-worth-label">
            Net Worth
          </span>
        </div>

        <div class="net-worth-change">
          <span class="change-icon"></span>
          <span class="change-value">
            $2,500 (2.01%)
          </span>
        </div>

      </div>
      <div class="net-worth-chart">
        Chart
      </div>
      <div class="net-worth-range">
        Time Range
      </div>
    </div>

    <aside class="net-worth-sidebar">
      <div class="welcome-panel">
        Welcome
      </div>

      <div class="summary-panel">
        Retirement
      </div>

      <div class="summary-panel">
        Liquid Funds
      </div>

      <div class="summary-panel">
        Debt
      </div>
    </aside>

  </section>
  <div class="dashboard-columns">
    <section class="accounts-section">
      Accounts
    </section>
    <section class="transactions-section">
      Transactions
    </section>
  </div>
</div>
