<h1>Coiny</h1>

<form (ngSubmit)="login()">
  <div>
    <label for="email">Email</label>
    <input
      id="email"
      name="email"
      type="email"
      [(ngModel)]="model.email"
      required
    />
  </div>

  <div>
    <label for="password">Password</label>
    <input
      id="password"
      name="password"
      type="password"
      [(ngModel)]="model.password"
      required
    />
  </div>

  <button type="submit">Login</button>
</form>
