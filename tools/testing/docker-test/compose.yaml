name: coiny-test
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: coiny_test_control
      POSTGRES_USER: coiny_test
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?Run python3 test-stack.py init}
    volumes:
      - control-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U coiny_test -d coiny_test_control"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
  api:
    image: coiny-test-api:local
    build:
      context: ../../..
      dockerfile: tools/testing/docker-test/Api.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Data Source=/data/coiny-test.db
      Jwt__Key: ${TEST_JWT_KEY:?Run python3 test-stack.py init}
      Jwt__Issuer: CoinyDockerTest
      Jwt__Audience: CoinyDockerTestUsers
      Jwt__ExpirationMinutes: "120"
      Logging__LogLevel__Default: Warning
    volumes:
      - app-data:/data
      - protection-keys:/home/app/.aspnet/DataProtection-Keys
    ulimits:
      core: 0
    mem_limit: 768m
  web:
    image: coiny-test-web:local
    build:
      context: ../../..
      dockerfile: tools/testing/docker-test/Web.Dockerfile
    ports:
      - "127.0.0.1:6080:80"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    mem_limit: 256m
  integration:
    profiles: [integration]
    build:
      context: ../../..
      dockerfile: tools/testing/docker-test/Integration.Dockerfile
    environment:
      COINY_TEST_POSTGRES: Host=postgres;Database=coiny_test_control;Username=coiny_test;Password=${TEST_POSTGRES_PASSWORD};Pooling=false
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 1536m
volumes:
  control-data:
  app-data:
  protection-keys:
  caddy-data:
  caddy-config:
