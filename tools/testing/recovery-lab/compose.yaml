name: coiny-recovery-lab
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: coiny_recovery
      POSTGRES_USER: coiny_recovery
      POSTGRES_PASSWORD: ${RECOVERY_POSTGRES_PASSWORD:?Run python3 recovery-lab.py up}
    volumes:
      - control-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U coiny_recovery -d coiny_recovery"]
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 512m
  api:
    image: coiny-recovery-api:local
    build:
      context: ../../..
      dockerfile: tools/testing/docker-test/Api.Dockerfile
    entrypoint: [dotnet, Coiny.API.dll]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      HybridStorage__Enabled: "true"
      HybridStorage__ControlConnection: Host=postgres;Database=coiny_recovery;Username=coiny_recovery;Password=${RECOVERY_POSTGRES_PASSWORD};Pooling=false;GSS Encryption Mode=Disable
      HybridStorage__DataRoot: /data/households
      HybridStorage__Node: recovery-lab
      Operations__ScheduledJobsEnabled: "false"
      RecoveryEmail__Host: ""
      Jwt__Key: ${RECOVERY_JWT_KEY:?Run python3 recovery-lab.py up}
      Jwt__Issuer: CoinyRecoveryLab
      Jwt__Audience: CoinyRecoveryLabUsers
      Jwt__ExpirationMinutes: "120"
      Logging__LogLevel__Default: Warning
    volumes:
      - household-data:/data
      - protection-keys:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      postgres:
        condition: service_healthy
    ulimits:
      core: 0
    mem_limit: 768m
  web:
    image: coiny-recovery-web:local
    build:
      context: ../../..
      dockerfile: tools/testing/docker-test/Web.Dockerfile
    ports:
      - "127.0.0.1:6082:80"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api]
    mem_limit: 256m
volumes:
  control-data:
  household-data:
  protection-keys:
  caddy-data:
  caddy-config:
