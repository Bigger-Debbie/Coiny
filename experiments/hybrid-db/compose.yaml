name: coiny-hybrid-lab
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: coiny_hybrid_lab
      POSTGRES_USER: coiny_lab
      POSTGRES_PASSWORD: ${LAB_POSTGRES_PASSWORD:?Run python3 lab.py init first}
    volumes:
      - control-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U coiny_lab -d coiny_hybrid_lab"]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 512m
  app:
    build:
      context: .
    environment:
      ASPNETCORE_URLS: http://+:8080
      Lab__Enabled: "true"
      Lab__ControlConnection: Host=postgres;Database=coiny_hybrid_lab;Username=coiny_lab;Password=${LAB_POSTGRES_PASSWORD};Timeout=3;Command Timeout=5
      Lab__Key: ${LAB_KEY:?Run python3 lab.py init first}
      Lab__SigningKey: ${LAB_SIGNING_KEY:?Run python3 lab.py init first}
      Lab__DataRoot: /data
      Lab__Node: lab-node-1
      Lab__TargetSchema: "2"
    ports:
      - "127.0.0.1:6088:8080"
    volumes:
      - household-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m
volumes:
  control-data:
  household-data:
